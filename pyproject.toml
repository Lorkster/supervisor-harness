[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-harness"
version = "0.1.0"
description = "A supervising agentic harness that adds analysis, parallel execution, drift correction, verified definitions of done and a self-improvement loop to Claude Code and Cursor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lorkster" }]
keywords = ["agents", "mcp", "claude-code", "cursor", "orchestration", "supervisor"]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
# Autonomous Bedrock. Deliberately an extra rather than a runtime dependency:
# the package otherwise has exactly one, and this pulls the Anthropic SDK plus
# boto3 and botocore. Nothing imports it unless a provider of type "bedrock" is
# actually configured -- see providers/bedrock.py.
bedrock = ["anthropic[bedrock]>=0.40"]
# ruff and mypy are pinned to a minor range because both gate at **zero**. An
# unbounded pin means a new release adding a rule to a selected family turns
# an unrelated pull request red; upgrading either should be a deliberate act
# whose new findings are read and dealt with.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "mcp>=1.2",
       "ruff>=0.16.5,<0.17", "mypy>=1.11,<2"]

[project.scripts]
supervisor = "supervisor_harness.cli:main"
supervisor-mcp = "supervisor_harness.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supervisor_harness = ["integrations/*.json", "integrations/*/*.md", "integrations/*/*.mdc"]

# Ruff, configured in batch 4a and driven to **zero findings** in 4b-4. CI runs
# `ruff check` and fails on anything, which it can only do because the set is
# actually clean -- see docs/quality-assessment.md for how it was chosen.
#
# Widening the set later means driving the new rule to zero in the same batch.
# Do not reintroduce a tolerated baseline: a permanent backlog is not a
# standard, which is criterion 4 of that document.
[tool.ruff]
line-length = 100          # the code is written to ~96; ruff's default 88 flagged 593 lines
target-version = "py311"   # matches requires-python

[tool.ruff.lint]
# Chosen by measurement rather than taste -- the numbers are in the assessment.
# `S` (bandit) earns its place in a project about constraining what agents may
# run: it costs 8 findings across `src`, and it makes the `# noqa: S603` and
# `# noqa: S608` directives already written in this codebase mean something.
# Deliberately *not* selected:
#   PLR2004 (magic values)      86 findings, almost all thresholds read from policy
#   PLC0415 (import not at top) 86 findings, and lazy imports here are deliberate
#                               -- `providers/bedrock.py` depends on being one
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "BLE", "TRY004"]
# `BLE` and `TRY004` were added when finding Q-Q2 was closed. Both cost *zero*
# new findings: every broad `except` in this codebase already carried a
# `# noqa: BLE001` written for a rule nobody had enabled, so turning the rule on
# made 14 existing directives mean something instead of deleting them. The value
# is in what happens next -- a broad `except` added from here on is flagged, and
# has to be suppressed on purpose.
#
# `C901` is deliberately still off: it would add 16 findings, and those are
# finding Q-A2, whose complexity lives in `store/events.py`, `core/journal.py`
# and `core/phases.py` rather than anywhere this batch touches.

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is made of, and a subprocess in a test is the test.
"tests/**" = ["S101", "S603", "S607"]
"tools/**" = ["S603", "S607"]

# The codebase turned out to be almost fully annotated -- 3 errors across 40
# files when this was first run, all fixed in the same batch -- so unlike ruff
# this gates at **zero** from the start. `--strict` costs 14 more errors in 8
# files and is recorded in docs/quality-assessment.md as finding Q-T2.
[tool.mypy]
python_version = "3.11"
files = ["src/supervisor_harness"]
ignore_missing_imports = true      # mcp, anthropic and boto3 ship partial stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
