<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Searching Our Logs with VictoriaLogs</title>
<style>
:root{
  --bg:#080b16; --panel:#111730; --panel2:#182042; --panel3:#1f2950;
  --line:#2a3563; --line2:#3a4880;
  --ink:#eaeefb; --muted:#98a5c8; --dim:#6a769f;
  --brand:#7c8cff; --cyan:#2ad4ee; --amber:#fbbf24; --emerald:#34d399;
  --rose:#fb7185; --violet:#b79cff; --lime:#a3e635;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

#stage{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:
   radial-gradient(1100px 620px at 88% -12%, rgba(124,140,255,.16), transparent 62%),
   radial-gradient(760px 520px at -8% 108%, rgba(42,212,238,.10), transparent 60%),
   linear-gradient(180deg,#0c1122 0%, #080b16 100%);
  border:1px solid var(--line);border-radius:14px;padding:40px 52px 46px;
  display:none;flex-direction:column;overflow:hidden}
.slide.on{display:flex;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.rail{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);margin-bottom:12px;flex:none}
.rail b{color:var(--brand);font-weight:600}
h1{font-size:50px;line-height:1.06;margin:0 0 12px;letter-spacing:-.022em;font-weight:700}
h2{font-size:31px;line-height:1.14;margin:0 0 6px;letter-spacing:-.018em;font-weight:650}
.sub{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 16px;max-width:104ch}
.sub em{color:var(--cyan);font-style:normal}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}

.card{background:linear-gradient(180deg,rgba(24,32,66,.9),rgba(17,23,48,.9));border:1px solid var(--line);
  border-radius:11px;padding:14px 16px}
.card h3{margin:0 0 7px;font-size:14.5px;letter-spacing:.01em;color:var(--ink);font-weight:640;
  display:flex;align-items:center;gap:8px}
.card p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.card p+p{margin-top:6px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);
  padding:3px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);background:rgba(31,41,80,.6)}
ul.tight{margin:0;padding-left:17px;font-size:13px;line-height:1.6;color:var(--muted)}
ul.tight li{margin-bottom:3px}
ul.tight li::marker{color:var(--brand)}
ul.tight b,.card p b{color:var(--ink);font-weight:600}
.k{font-family:var(--mono);font-size:12.5px;color:var(--cyan);background:rgba(42,212,238,.09);
  padding:1px 5px;border-radius:4px;border:1px solid rgba(42,212,238,.2)}
.note{font-size:12.5px;color:var(--dim);line-height:1.5}

pre.q{font-family:var(--mono);font-size:13px;line-height:1.6;margin:0;padding:10px 12px;
  background:#070b18;border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:8px;color:#cdd6f4;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
pre.q.sm{font-size:12px;padding:9px 11px;line-height:1.55}
pre.q.good{border-left-color:var(--emerald)}
pre.q.bad{border-left-color:var(--rose);opacity:.92}
.t-pipe{color:var(--violet);font-weight:600}
.t-fn{color:var(--amber)}
.t-sf{color:var(--cyan);font-weight:600}
.t-str{color:var(--lime)}
.t-kw{color:var(--rose)}
.t-op{color:#7d8ab5}
.t-cm{color:#4d5a85;font-style:italic}

.fill{font-family:var(--mono);font-size:.9em;color:#0a0d18;background:linear-gradient(90deg,#fbbf24,#fcd34d);
  padding:1px 7px;border-radius:5px;font-weight:600;box-shadow:0 0 0 1px rgba(251,191,36,.4)}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  padding:0 9px 6px;font-weight:600;border-bottom:1px solid var(--line)}
table.t td{padding:6px 9px;border-bottom:1px solid rgba(42,53,99,.5);vertical-align:top;color:var(--muted);line-height:1.42}
table.t tr:last-child td{border-bottom:none}
table.t code{font-family:var(--mono);font-size:11.8px;color:#a9b8ff;white-space:nowrap}
table.t td b{color:var(--ink)}

.act{align-items:center;justify-content:center;text-align:center}
.act .num{font-family:var(--mono);font-size:14px;letter-spacing:.4em;color:var(--brand);margin-bottom:16px}
.act h1{font-size:58px;max-width:20ch}
.act .sub{font-size:18px;max-width:58ch;margin:12px auto 0;text-align:center}

.hero{justify-content:center}
.hero .eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:20px}
.hero h1{font-size:64px;max-width:19ch}
.hero .sub{font-size:18.5px;max-width:64ch}
.hero .meta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}

.ladder{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ladder div{flex:1;padding:8px 8px;font-size:11px;text-align:center;font-family:var(--mono);
  color:#0a0d18;font-weight:650}

.ui{border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#0b1020;font-size:11px}
.ui .bar{background:linear-gradient(90deg,#3c4bb8,#4f5fd6);padding:6px 11px;display:flex;align-items:center;
  gap:12px;color:#fff;font-size:11px;font-weight:600}
.ui .bar .sp{flex:1}
.ui .bar .chip{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:5px;font-weight:500}
.ui .row{display:flex;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);align-items:center}
.ui .inp{flex:1;background:#070b18;border:1px solid var(--line2);border-radius:5px;padding:5px 9px;
  font-family:var(--mono);color:#cdd6f4;font-size:11px}
.ui .btn{background:var(--brand);color:#0a0d18;padding:4px 12px;border-radius:5px;font-weight:700;font-size:10.5px}
.ui .btn.gh{background:transparent;border:1px solid var(--line2);color:var(--muted);font-weight:500}
.ui .tabs{display:flex;gap:2px;padding:6px 11px 0}
.ui .tabs span{padding:5px 13px;border-radius:6px 6px 0 0;color:var(--dim);font-size:10.5px}
.ui .tabs span.a{background:var(--panel2);color:var(--cyan);border:1px solid var(--line);border-bottom:none;font-weight:600}
.ui .hist{display:flex;align-items:flex-end;gap:2.5px;height:46px;padding:8px 11px;background:#0a0f1f}
.ui .hist i{flex:1;background:linear-gradient(180deg,#4a5ad0,#2b3670);border-radius:2px 2px 0 0}
.ui .logs{padding:7px 11px;font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.75}
.ui .logs b{color:var(--emerald);font-weight:500}
.ui .side{width:146px;border-right:1px solid var(--line);padding:8px;flex:none}
.ui .side div{padding:3px 6px;border-radius:4px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}
.ui .side div span{color:var(--dim)}

.badge{width:19px;height:19px;border-radius:50%;background:var(--amber);color:#0a0d18;font-size:11px;
  font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;font-family:var(--mono)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);line-height:1.42}
.legend div{display:flex;gap:9px;align-items:flex-start}
.legend b{color:var(--ink);font-weight:600}

.flow{display:flex;align-items:stretch}
.step{flex:1;background:linear-gradient(180deg,rgba(24,32,66,.95),rgba(17,23,48,.95));
  border:1px solid var(--line);padding:12px}
.step:first-child{border-radius:10px 0 0 10px}
.step:last-child{border-radius:0 10px 10px 0}
.step+.step{border-left:none}
.step .n{font-family:var(--mono);font-size:10px;color:var(--brand);letter-spacing:.14em;margin-bottom:5px}
.step h4{margin:0 0 5px;font-size:13.5px;font-weight:640}
.step p{margin:0;font-size:11.8px;line-height:1.48;color:var(--muted)}
.step code{font-family:var(--mono);font-size:11px;color:var(--cyan);display:block;margin-top:6px;word-break:break-all}

#hud{position:fixed;bottom:10px;right:14px;display:flex;align-items:center;gap:11px;
  font-family:var(--mono);font-size:11px;color:var(--dim);z-index:40}
#hud kbd{border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--muted);font-size:10px}
#prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--brand),var(--cyan));z-index:41;transition:width .25s}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:rgba(11,16,32,.96);
  border-top:1px solid var(--line2);padding:16px 26px;font-size:14px;line-height:1.6;color:var(--muted);
  z-index:50;display:none}
#notes b{color:var(--ink)}
#notes .h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
#grid{position:fixed;inset:0;background:rgba(8,11,22,.97);z-index:60;overflow:auto;padding:24px;
  display:none;grid-template-columns:repeat(5,1fr);gap:11px;align-content:start}
#grid.on{display:grid}
#grid .th{border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;background:var(--panel);
  font-size:11px;line-height:1.35;color:var(--muted);min-height:60px}
#grid .th:hover{border-color:var(--brand);color:var(--ink)}
#grid .th i{font-family:var(--mono);color:var(--brand);font-style:normal;font-size:9.5px;display:block;margin-bottom:4px}
#grid .th.cur{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}

@media print{
  html,body{overflow:visible;height:auto;display:block}
  #hud,#prog,#notes,#grid{display:none!important}
  #stage{transform:none!important;width:1280px;height:auto}
  .slide{display:flex!important;position:relative;page-break-after:always;margin:0 0 10px;border-radius:0;
    width:1280px;height:720px}
}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"></div>
<div id="notes"></div>
<div id="grid"></div>
<div id="hud">
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd></span>
  <span><kbd>g</kbd> grid</span>
  <span><kbd>n</kbd> notes</span>
  <span id="count">1 / 1</span>
</div>
<script>
/* =====================================================================
   EDIT ME.  Everything site-specific about OUR deployment lives here.
   Replace every {{FILL: ...}} with the real value.  Nothing else in this
   file needs to change.  See HANDOFF.md next to this file.
   ===================================================================== */
const CONFIG = {
  org:            "{{FILL: team or org name}}",
  vlUrl:          "{{FILL: https://logs.internal.example.com}}",
  vmuiUrl:        "{{FILL: https://logs.internal.example.com/select/vmui/}}",
  mcpUrl:         "{{FILL: https://vl-mcp.internal.example.com/mcp}}",
  tenant:         "{{FILL: 0:0 or the AccountID:ProjectID we use}}",
  retention:      "{{FILL: e.g. 30d}}",
  volume:         "{{FILL: e.g. ~40 GB/day, ~120M entries/day}}",
  clusterOrSingle:"{{FILL: single-node or cluster}}",
  shipper:        "{{FILL: e.g. OpenTelemetry Collector / Vector / Fluent Bit}}",

  // The fields that actually form _stream in our deployment, most-used first.
  streamFields: [
    { name: "{{FILL: stream field 1}}", desc: "{{FILL: what it identifies}}", card: "{{FILL: approx cardinality}}" },
    { name: "{{FILL: stream field 2}}", desc: "{{FILL: what it identifies}}", card: "{{FILL: approx cardinality}}" },
    { name: "{{FILL: stream field 3}}", desc: "{{FILL: what it identifies}}", card: "{{FILL: approx cardinality}}" }
  ],

  // Non-stream fields people search on constantly.
  keyFields: [
    { name: "{{FILL: level field, e.g. log.level}}", vals: "{{FILL: e.g. debug|info|warn|error}}", desc: "{{FILL}}" },
    { name: "{{FILL: trace/correlation id field}}",  vals: "{{FILL: format}}",  desc: "{{FILL}}" },
    { name: "{{FILL: http status field}}",           vals: "{{FILL: e.g. 200..599}}", desc: "{{FILL}}" },
    { name: "{{FILL: latency field + unit}}",        vals: "{{FILL: e.g. ms as number}}", desc: "{{FILL}}" }
  ],

  // Is _msg structured JSON, logfmt, or free text? Per service if it varies.
  msgShape: "{{FILL: describe _msg — JSON already unpacked at ingest? logfmt? free text?}}",

  // Our services, as they appear in the stream fields above.
  services: [
    { name: "{{FILL: service}}", stream: "{{FILL: {app=\"...\"} selector}}", notes: "{{FILL: what its logs look like}}" },
    { name: "{{FILL: service}}", stream: "{{FILL: {app=\"...\"} selector}}", notes: "{{FILL: what its logs look like}}" },
    { name: "{{FILL: service}}", stream: "{{FILL: {app=\"...\"} selector}}", notes: "{{FILL: what its logs look like}}" }
  ],

  // Real queries for real questions we ask. Keep the "why" short and concrete.
  cookbook: [
    { q: "{{FILL: LogsQL for 'what is erroring right now'}}",              why: "{{FILL: when to reach for it}}" },
    { q: "{{FILL: LogsQL for 'follow one request across services'}}",      why: "{{FILL}}" },
    { q: "{{FILL: LogsQL for 'error rate per service over the last day'}}",why: "{{FILL}}" },
    { q: "{{FILL: LogsQL for 'slowest endpoints'}}",                       why: "{{FILL}}" },
    { q: "{{FILL: LogsQL for 'what changed after the deploy at T'}}",      why: "{{FILL}}" },
    { q: "{{FILL: LogsQL for 'noisiest log line, candidates for dropping'}}", why: "{{FILL}}" }
  ],

  gotchas: [
    "{{FILL: a real trap in our logs — a field that is a string not a number, a service that double-encodes JSON, a renamed field, a shipper that drops a field, etc.}}",
    "{{FILL: second gotcha}}",
    "{{FILL: third gotcha}}"
  ]
};

/* =====================================================================
   Rendering engine.  You should not need to touch anything below here.
   ===================================================================== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* {{FILL: ...}} -> highlighted chip */
function fills(s){
  return String(s).replace(/\{\{FILL:?\s*([^}]*)\}\}/g, function(_,t){
    return '<span class="fill">'+esc(t.trim()||'FILL')+'</span>';
  });
}

/* LogsQL syntax highlighting */
var HL_RE = new RegExp([
  '(#[^\\n]*)',
  '("[^"]*"|\'[^\']*\')',
  '(\\|\\s*[a-z_]+)',
  '(\\b(?:_time|_msg|_stream_id|_stream)\\b)',
  '(\\b(?:count_uniq_hash|count_uniq|count_empty|count|sum_len|sum|avg|min|max|median|quantile|stddev|rate_sum|rate|histogram|uniq_values|json_values|values|row_any|row_min|row_max|field_min|field_max|round|abs|ceil|floor)\\s*\\()',
  '(\\b(?:AND|OR|NOT|by|as|if|in|not_in|offset|desc|asc|from|with|hits|rank|partition|options|where|before|after|time_window|preserve_keys|keep_original_fields|skip_empty_results|result_prefix)\\b)'
].join('|'),'g');

function hl(src){
  var stash=[], i=0;
  var s = String(src).replace(/\{\{FILL:?\s*([^}]*)\}\}/g,function(_,t){
    stash.push(t.trim()||'FILL'); return ''+(i++)+'';
  });
  s = esc(s).replace(HL_RE, function(m,cm,str,pipe,sf,fn,kw){
    if(cm!==undefined) return '<span class="t-cm">'+cm+'</span>';
    if(str!==undefined) return '<span class="t-str">'+str+'</span>';
    if(pipe!==undefined){
      var bar=pipe.slice(0,1), rest=pipe.slice(1);
      return '<span class="t-op">'+bar+'</span><span class="t-pipe">'+rest+'</span>';
    }
    if(sf!==undefined) return '<span class="t-sf">'+sf+'</span>';
    if(fn!==undefined) return '<span class="t-fn">'+fn+'</span>';
    if(kw!==undefined) return '<span class="t-kw">'+kw+'</span>';
    return m;
  });
  return s.replace(/(\d+)/g,function(_,n){
    return '<span class="fill">'+esc(stash[+n])+'</span>';
  });
}
function q(code,cls){return '<pre class="q '+(cls||'')+'">'+hl(code)+'</pre>';}
function qs(code,cls){return '<pre class="q sm '+(cls||'')+'">'+hl(code)+'</pre>';}

var SLIDES=[];
function S(o){SLIDES.push(o);}

/* text helper: escape then turn {{FILL}} into a chip */
function F(s){return fills(esc(s));}

/* ------------------------------------------------------------------ 1 */
S({title:'Title', hero:true, cls:'hero', html:`
<div class="eyebrow">Internal training &middot; VictoriaLogs</div>
<h1>Searching our logs<br>without guessing</h1>
<p class="sub">A working knowledge of the VictoriaLogs UI, the LogsQL query language, and how to point an
agent at our logs so it finds the answer in three calls instead of thirty.</p>
<div class="meta">
  <span class="pill">${F(CONFIG.vmuiUrl)}</span>
  <span class="pill">retention ${F(CONFIG.retention)}</span>
  <span class="pill">${F(CONFIG.volume)}</span>
  <span class="pill">MCP ${F(CONFIG.mcpUrl)}</span>
</div>
<div style="margin-top:22px"><span id="fillcount" class="pill" style="border-width:1px">&nbsp;</span></div>
`, notes:`Open with the pain: someone pastes a stack trace in Slack and three people start grepping different places.
The promise of this session is that by the end everyone can go from a symptom to the exact log line, and can hand the
same job to an agent. <b>Housekeeping:</b> arrows to move, <b>g</b> for the slide grid, <b>n</b> for these notes.`});

/* ------------------------------------------------------------------ 2 */
S({title:'What you will leave with', act:'Agenda', html:`
<h2>Four things, in order</h2>
<p class="sub">Each act stands on the one before it. The mental model is short but it is the part that makes
everything else obvious &mdash; do not skip it.</p>
<div class="body">
  <div class="grid g4" style="flex:1">
    <div class="card"><h3><span class="dot" style="background:var(--brand)"></span>I &middot; Model</h3>
      <p>What a log <b>is</b> to VictoriaLogs: a flat JSON object, four special fields, and a <b>stream</b>.
      Streams are the whole performance story.</p></div>
    <div class="card"><h3><span class="dot" style="background:var(--cyan)"></span>II &middot; The UI</h3>
      <p>The two screens in <b>vmui</b>: <b>Overview</b> to find out what exists, <b>Query</b> to interrogate it.
      Four result modes and when each one is right.</p></div>
    <div class="card"><h3><span class="dot" style="background:var(--violet)"></span>III &middot; LogsQL</h3>
      <p><b>Filters</b> pick the logs, <b>pipes</b> transform and count them. A ladder of filters from fastest to
      slowest, and the pipes worth memorising.</p></div>
    <div class="card"><h3><span class="dot" style="background:var(--amber)"></span>IV &middot; Agents</h3>
      <p>The 13 MCP tools, the discovery loop that keeps an agent cheap and honest, and the prompt patterns that
      stop it dumping 10,000 lines into its context.</p></div>
  </div>
  <p class="note">Everything specific to our deployment is highlighted <span class="fill">like this</span>.
  Those values live in one <span class="k">CONFIG</span> block at the top of this file.</p>
</div>
`, notes:`Set expectations on timing: roughly 10 / 15 / 25 / 15 minutes. Tell people the deck is a file in the repo,
so it doubles as the reference they will come back to.`});

/* ------------------------------------------------------------------ 3 */
S({title:'Act I — the mental model', cls:'act', act:'', html:`
<div class="num">ACT I</div>
<h1>The mental model</h1>
<p class="sub">Three ideas. If you hold these, LogsQL stops being syntax you look up and starts being
something you can reason about.</p>
`, notes:`Deliberately slow down here. Most bad queries come from a wrong model of the storage, not from a typo.`});

/* ------------------------------------------------------------------ 4 */
S({title:'A log entry is flat JSON + 4 special fields', act:'Act I', railr:'Data model', html:`
<h2>Every log entry is one flat JSON object</h2>
<p class="sub">Nested JSON is flattened at ingest by joining keys with dots. Numbers, booleans and arrays become
strings. <em>Every field is indexed</em>, so filtering on a field is always cheaper than searching the message text.</p>
<div class="body">
 <div class="grid g2" style="flex:1">
  <div>
   ${q(`{
  "_time":   "2026-09-09T10:14:22.581Z",
  "_msg":    "upstream timeout after 30s",
  "_stream": "{app=\\"checkout\\",pod=\\"checkout-7d9\\"}",
  "_stream_id": "0000007b000001c850d99...",

  "log.level":  "error",
  "trace_id":   "9c3f1a0e77b4",
  "http.status": "504",
  "duration_ms": "30014"
}`)}
   <p class="note" style="margin-top:10px">A shipper sent <span class="k">{"http":{"status":504}}</span>;
   VictoriaLogs stored it as <span class="k">http.status="504"</span>.</p>
  </div>
  <div class="grid" style="gap:10px;align-content:start">
   <div class="card"><h3><span class="dot" style="background:var(--cyan)"></span>_time</h3>
     <p>The timestamp. Drives every time filter and lets VictoriaLogs skip whole days of data without reading them.</p></div>
   <div class="card"><h3><span class="dot" style="background:var(--cyan)"></span>_msg</h3>
     <p>The message. Searched by default when you type a bare word. In our logs: ${F(CONFIG.msgShape)}</p></div>
   <div class="card"><h3><span class="dot" style="background:var(--cyan)"></span>_stream / _stream_id</h3>
     <p>Which instance emitted this. <b>The index that makes queries fast</b> &mdash; next slide.</p></div>
   <div class="card"><h3><span class="dot" style="background:var(--brand)"></span>everything else</h3>
     <p>Ordinary fields. <b>Prefer them over text search</b>: <span class="k">trace_id:="9c3f"</span> beats hunting
     for the id inside <span class="k">_msg</span>.</p></div>
  </div>
 </div>
</div>
`, notes:`The flattening rule surprises people: they look for <b>http.status</b> and type <b>http:status</b>.
Also stress the last card — the single most common inefficiency is full-text searching for something that is
already a field.`});

/* ------------------------------------------------------------------ 5 */
S({title:'Log streams are the index', act:'Act I', railr:'Streams', html:`
<h2>Log streams: the one lever that changes query cost</h2>
<p class="sub">Logs are stored grouped <em>per stream, ordered by time</em>. A stream filter lets VictoriaLogs skip
entire blocks instead of scanning them. A time filter plus a stream filter is the difference between milliseconds
and minutes.</p>
<div class="body">
 <div class="grid g3" style="flex:1">
  <div class="card"><h3><span class="dot" style="background:var(--emerald)"></span>What belongs in a stream</h3>
    <p>Fields that <b>identify an instance and never change during its life</b>: app, namespace, pod, node, container.</p>
    ${qs(`{app="checkout", pod="checkout-7d9"}`,'good')}</div>
  <div class="card"><h3><span class="dot" style="background:var(--rose)"></span>What must never be</h3>
    <p>High-cardinality values: <b>ip, user_id, trace_id, request_id</b>. Putting them in a stream degrades
    memory, CPU, disk and query speed &mdash; badly.</p>
    ${qs(`{trace_id="9c3f1a0e77b4"}   # never`,'bad')}</div>
  <div class="card"><h3><span class="dot" style="background:var(--brand)"></span>How you use it</h3>
    <p>The <span class="k">{...}</span> filter goes anywhere in the query and is always worth adding. It is
    equivalent to <span class="k">app:="checkout"</span> but far faster.</p>
    ${qs(`_time:1h {app="checkout"} error`,'good')}</div>
 </div>
 <div class="card" style="border-color:var(--line2)">
  <h3><span class="dot" style="background:var(--amber)"></span>Our stream fields</h3>
  <table class="t"><thead><tr><th>Field</th><th>Identifies</th><th>Approx. distinct values</th></tr></thead><tbody>
  ${CONFIG.streamFields.map(function(f){return '<tr><td><code>'+F(f.name)+'</code></td><td>'+F(f.desc)+'</td><td>'+F(f.card)+'</td></tr>';}).join('')}
  </tbody></table>
 </div>
</div>
`, notes:`Analogy that lands: a stream is a single log file on a single machine. VictoriaLogs keeps one sorted file
per stream; naming the stream is telling it which files to open. Ask the room to name a field they would be
tempted to add to the stream and why it would be a disaster.`});

S({title:'Overview tab — start here', act:'Act II', railr:'Overview tab',
  flag:'VERIFY against our vmui', html:`
<h2>Overview: what is in here at all?</h2>

values do they take</em> &mdash; without writing a single query.</p>

     <div style="flex:1;border:1px solid var(--line);border-radius:6px;padding:7px 9px"><div style="color:var(--dim);font-size:9.5px">UNIQUE STREAMS</div><div style="font-size:17px;font-weight:700">28</div></div>
   </div>
   <div class="hist"><i style="height:40%"></i><i style="height:72%"></i><i style="height:55%"></i><i style="height:88%"></i><i style="height:61%"></i><i style="height:47%"></i><i style="height:95%"></i><i style="height:66%"></i><i style="height:52%"></i><i style="height:78%"></i><i style="height:44%"></i><i style="height:69%"></i></div>

     <div style="flex:1;padding:8px 11px">
       <div style="color:var(--dim);font-size:9.5px;margin-bottom:5px">FIELD NAME &nbsp;&nbsp; HITS &nbsp;&nbsp; COVERAGE %</div>
       <div class="logs" style="padding:0">collector <b>2,115</b> &nbsp; 100%<br>host.name <b>1,440</b> &nbsp; 68%<br>k8s.namespace.name <b>1,440</b> &nbsp; 68%<br>k8s.pod.name <b>1,440</b> &nbsp; 68%<br>log.level <b>1,982</b> &nbsp; 94%</div>
     </div>

       <div style="color:var(--dim);font-size:9.5px;margin-bottom:5px">FIELD VALUES &nbsp; MODE: TOP &nbsp; TOP N: 10</div>

  </div>

   <div><span class="badge">2</span><span><b>Hits histogram.</b> Volume over time. Use it to spot the moment

   <div><span class="badge">3</span><span><b>Fields table.</b> Every field name with hit count and

 </div>

`, notes:`The coverage column is the hidden gem. Filtering on a field with 68% coverage silently excludes a third of

/* ------------------------------------------------------------------ 9 */
S({title:'Query tab — anatomy', act:'Act II', railr:'Query tab',
  flag:'VERIFY against our vmui', html:`
<h2>Query: the six controls that matter</h2>
<p class="sub">The query box is the obvious part. The five controls around it are where most of the speed and most
of the confusion live.</p>
<div class="body">
 <div class="grid" style="grid-template-columns:1.35fr 1fr;flex:1">
  <div class="ui">
   <div class="bar"><span>VMUI</span><span style="border-bottom:2px solid #fff">Query</span><span style="opacity:.7">Overview</span><span class="sp"></span><span class="chip">${F(CONFIG.tenant)}</span><span class="chip">Last 5 minutes</span><span class="chip">auto-refresh: Off</span></div>
   <div class="row"><div class="inp">_time:1h {app="checkout"} error | stats by (log.level) count()</div>
     <div style="width:64px"><div style="color:var(--dim);font-size:9px">LIMIT</div><div class="inp" style="padding:3px 6px">50</div></div></div>
   <div class="row"><span class="btn gh">Show filters</span><span class="sp" style="flex:1"></span>
     <span class="btn gh">Query examples</span><span class="btn gh">Autocomplete: Off</span><span class="btn gh">History</span><span class="btn">Execute</span></div>
   <div class="row" style="border-bottom:none;padding-bottom:2px"><span class="pill" style="font-size:10px">Total: 2,255</span>
     <span class="pill" style="font-size:10px">Interval: 15s</span><span class="pill" style="font-size:10px">Group by: none</span>
     <span class="sp" style="flex:1"></span><span class="pill" style="font-size:10px">Cumulative</span><span class="pill" style="font-size:10px">Stats view</span><span class="pill" style="font-size:10px">Stacked</span></div>
   <div class="hist"><i style="height:38%"></i><i style="height:70%"></i><i style="height:52%"></i><i style="height:91%"></i><i style="height:58%"></i><i style="height:44%"></i><i style="height:80%"></i><i style="height:63%"></i><i style="height:49%"></i><i style="height:74%"></i><i style="height:41%"></i><i style="height:66%"></i></div>
   <div class="tabs" style="border-top:1px solid var(--line)"><span class="a">Group</span><span>Table</span><span>JSON</span><span>Live</span></div>
   <div class="logs" style="border-top:1px solid var(--line)">10:14:22.581 <b>ERROR</b> upstream timeout after 30s<br>10:14:22.604 <b>ERROR</b> circuit breaker open for payments<br>10:14:23.110 <b>WARN</b>&nbsp; retry 2/3 for POST /checkout</div>
  </div>
  <div class="legend" style="justify-content:center">

   <div><span class="badge">4</span><span><b>History</b> and <b>Query examples.</b> History is per-browser and is the

     Stacked toggles. Explained two slides on.</span></div>

 </div>

`, notes:`Hammer point 2. People set limit=10 and think they made the query cheap. The query still scans the same
