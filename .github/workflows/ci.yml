name: CI

# The suite has only ever run on one developer's Windows machine, which is why
# two findings from the harness's review of itself are recorded as open against
# code paths rather than against a demonstration: creating a symlink on that host
# fails with WinError 1314, so `search`/`list_files` reading through one could not
# be reproduced. The POSIX branch of the file lock in store/eventlog.py has the
# same problem in reverse -- it is reasoned about rather than executed, and POSIX
# is where the unlink race it guards is fully live.
#
# Both operating systems are therefore load-bearing here, not belt and braces:
# Linux is where those two can be proven at all, and Windows is where the harness
# is actually developed. See docs/remediation-plan.md.

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing is a fact about that version; it should not hide
      # whether the others pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 is the floor pyproject declares; 3.14 is what the harness is
        # developed on. requires-python has no upper bound, so the newest is
        # tested rather than assumed.
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The console scripts are part of what is shipped, and nothing in the test
      # suite goes through them. An import error in cli.py or a broken entry
      # point would otherwise reach a user before it reached CI.
      - name: Entry point
        run: supervisor --help

      - name: Test
        run: python -m pytest -q

      # The mirror of the check in the `bedrock` job below, guarding the other
      # direction. `tests/test_bedrock_provider.py` holds both the tests that
      # need the extra and the ones guaranteeing a *default* install still
      # works. A module-level `pytest.importorskip` skips a whole file, which
      # took the default-install tests with it -- measured at 0 passed, 1
      # skipped here, reported as success. If that ever returns, this fails.
      - name: The default-install bedrock tests actually ran
        shell: bash
        run: |
          out=$(python -m pytest tests/test_bedrock_provider.py -q --no-header)
          echo "$out"
          if ! echo "$out" | grep -qE "[1-9][0-9]* passed"; then
            echo "::error::no bedrock test ran on a default install; the file is being skipped whole"
            exit 1
          fi

  # The matrix above deliberately installs `.[dev]` *without* the bedrock extra,
  # so it is the default-install shape: one runtime dependency, the Anthropic SDK
  # absent, and the with-the-extra tests skipping. That is the shape almost every
  # user has, and the shape in which `providers.router` must still import.
  #
  # This job is the other shape. Without it the request/response mapping in
  # providers/bedrock.py would be tested nowhere -- `pytest.importorskip` would
  # skip it in every job and report success while covering nothing.
  bedrock:
    name: Bedrock extra installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bedrock]"

      # No AWS credentials and no network call: the client is constructed, and
      # every call goes to a stub. If this ever starts needing credentials, that
      # is a test reaching for the real API and should fail here rather than
      # quietly bill someone.
      - name: Test
        run: python -m pytest -q

      # The with-the-extra tests skip themselves when the SDK is missing, which
      # is correct in the matrix and would be a silent hole here. This job exists
      # to run them, so it fails if they did not run.
      - name: The bedrock tests actually ran
        run: |
          out=$(python -m pytest tests/test_bedrock_provider.py -q --no-header)
          echo "$out"
          if echo "$out" | grep -q skipped; then
            echo "::error::bedrock tests skipped in the job whose purpose is to run them"
            exit 1
          fi

  # Separate from the matrix: this compares two checkouts, so it needs the full
  # history, and running it eight times would say the same thing eight times.
  lint:
    name: Lint (no new findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate checks the base out into a worktree, so the shallow clone
          # the default gives is not enough.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Not a gate at zero: ruff has never been configured for this project and
      # reports 58 findings against its defaults on main, so a gate at zero
      # would be red on arrival and tell nobody anything. This fails only when a
      # (file, rule) pair gets worse -- the convention the pull requests have
      # been following by hand, which is exactly the kind of check that gets
      # skipped once someone is in a hurry.
      - name: No new ruff findings
        run: python tools/ruff_diff.py --base origin/${{ github.base_ref || 'main' }}

      # Gates at zero, unlike ruff. The codebase turned out to be almost fully
      # annotated -- 3 errors across 40 files when this was first measured -- so
      # there is no baseline to grandfather in and nothing to stage.
      - name: Types
        run: python -m mypy

      # A floor, not a target. It fails if a change drops coverage, which is the
      # property worth having -- the number itself is far less interesting than
      # the direction. 82 when first measured; raised to 86 when batch 4b-2
      # closed Q-C3, Q-C4 and Q-C5 and took it to 87.0. Raise it again as the
      # remaining findings close; the one still open is Q-C1, mcp_server.py at 0%.
      - name: Coverage floor
        run: python -m pytest -q --cov=supervisor_harness --cov-report=term:skip-covered --cov-fail-under=86

      # docs/reasoning-control-plane.md explains the design by pointing at the
      # code that implements it, by file and line. That is the useful form and
      # also the one that rots silently -- the code moves, the line number does
      # not, and the document goes on asserting something it no longer shows.
      # Every other place that names code is a test that would fail; this is the
      # guard for the ones that are prose. It gates at zero: unlike the ruff
      # baseline there is nothing pre-existing to grandfather in.
      - name: Documentation still points at the code
        run: python tools/check_doc_refs.py
